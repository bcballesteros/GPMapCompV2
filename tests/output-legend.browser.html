        check(xref[0]==='xref','PDF cross-reference offset');
        const objectCount=Number(xref[1].split(' ')[1]);
        for(let id=1;id<objectCount;id++) {

            check(text.slice(offset).startsWith(`${id} 0 obj\n`),`PDF cross-reference points to object ${id}`);
        }

        check(text.includes(`${page[1]} 0 0 ${page[2]} 0 0 cm\n/Im0 Do`),'PDF image fits complete page without clipping');

}

        // Recover on the same live map; this must not rely on constructing a new map.
        for(const format of ['png','jpeg','pdf']) {
            const decoded=await decodeOutput((await generateMapOutput(format)).blob,format);
            await verifyCanvas(decoded,groups());decoded.width=decoded.height=0;
        }
        for(const kind of ['export','share']) {
            await renderMapPreview('recovery',kind);
            check(document.getElementById(kind==='export'?'mapPreviewContainer':'sharePreviewContainer').classList.contains('ready'),'Preview recovers after output failure');
        }
        for(const kind of ['export','share','export','share']) {
            const modalId=`${kind}Modal`,target=document.getElementById(kind==='export'?'mapPreviewMap':'sharePreviewMap');
            const previous=target.firstElementChild;
            const ready=new Promise(resolve=>{
                const observer=new MutationObserver(()=>{if(target.firstElementChild!==previous){observer.disconnect();resolve();}});
                observer.observe(target,{childList:true});
            });
            openModal(modalId,{onOpen:()=>renderMapPreview('reopened',kind)});await ready;
            check(target.firstElementChild.width===longLayout.width&&target.firstElementChild.height===longLayout.height,'Reopening refreshes complete preview');
            const closed=new Promise(resolve=>{
                const listener=event=>{if(event.detail.modalId===modalId&&!event.detail.isOpen){window.removeEventListener('gpmap:modalchange',listener);resolve();}};
                window.addEventListener('gpmap:modalchange',listener);
            });
            closeModal(modalId);await closed;
        }
        const originalToBlob=HTMLCanvasElement.prototype.toBlob;
        try {
            HTMLCanvasElement.prototype.toBlob=function(callback){callback(null);};
            for(const format of ['png','jpeg','pdf']) {
                let failed=false;try {await generateMapOutput(format);} catch(error) {failed=/encode|convert/.test(error.message);}
                check(failed,'Encoding failure never returns an incomplete artifact');
            }
        } finally {HTMLCanvasElement.prototype.toBlob=originalToBlob;}
        await verifyCanvas(await renderMapToCanvas(),groups());
        report('Consecutive outputs and both previews recover after size-limit and encoder failures on the same map');
        check(!document.querySelector('[aria-hidden="true"][style*="-100000px"]'),'Temporary map targets cleaned');
        report('Temporary rendering resource cleanup');
        return reports;
    } finally {
        Object.keys(getState().uploadedLayers).forEach(removeManagedLayer);map.dispose();source.dispose();
    }
});
</script></body></html>
